# kitty — Gece setup
include gece.conf

# font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5
modify_font      cell_height 110%
disable_ligatures cursor

# window
shell                   /bin/zsh
window_padding_width    12 16
background_opacity      0.93
background_blur         1
confirm_os_window_close 0
remember_window_size    yes
initial_window_width    110c
initial_window_height   30c
hide_window_decorations no
wayland_titlebar_color  background
enabled_layouts         splits,stack
window_border_width     1pt
inactive_text_alpha     0.75

# cursor
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            3
cursor_trail_decay      0.1 0.3

# scrollback & mouse
scrollback_lines        20000
copy_on_select          clipboard
strip_trailing_spaces   smart
mouse_hide_wait         2.0
detect_urls             yes
url_style               curly

# tabs
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      " {index}: {title[:28]} "
active_tab_font_style   bold
inactive_tab_font_style normal

# bell
enable_audio_bell       no
visual_bell_duration    0.15

# misc
update_check_interval   0
shell_integration       enabled
allow_remote_control    socket-only
listen_on               unix:@kitty

# keys
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+\     launch --location=vsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+z     toggle_layout stack
map ctrl+equal       change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+shift+f     launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/less +G -R
map ctrl+shift+r     load_config_file
